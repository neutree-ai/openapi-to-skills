name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: bun install

      - run: bun run build

      # Authenticates as this workflow through npm trusted publishing, which
      # also attaches provenance. Configured on npmjs.com for this package.
      - run: npm publish --access public
